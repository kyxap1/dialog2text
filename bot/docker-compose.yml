# Paths are relative to bot/ ; ../ is the whisper-mlx repo root.
services:
  bot:
    build: .
    env_file: .env
    environment:
      MEDIA_DIR: /app/media
      JOBS_DIR: /app/jobs
      OUTPUT_DIR: /app/output
      METAPROMPT_PATH: /app/prompts/default.md
    volumes:
      - ../media:/app/media
      - ../jobs:/app/jobs
      - ../output:/app/output
      - ../prompts:/app/prompts:ro
    # Reach Docker Model Runner on the host when LLM_PROVIDER=local.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
