# Paths are relative to bot/ ; ../ is the whisper-mlx repo root.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - ../tg-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_API_ROOT: /var/lib/telegram-bot-api
      JOBS_DIR: /app/jobs
      OUTPUT_DIR: /app/output
      METAPROMPT_PATH: /app/prompts/default.md
    volumes:
      - ../tg-data:/var/lib/telegram-bot-api
      - ../jobs:/app/jobs
      - ../output:/app/output
      - ../prompts:/app/prompts:ro
    depends_on:
      - telegram-bot-api
    # Reach Docker Model Runner on the host when LLM_PROVIDER=local.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
